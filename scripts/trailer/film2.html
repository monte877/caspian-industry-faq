 'Caspian Industry. 15 avqust 2019-cu ildə Bakıda əsası qoyulan şirkətimiz neft-qaz və qeyri-neft sektorlarını məhsul və texniki xidmətlərlə təmin edir. Qırxdan çox peşəkar əməkdaşın birgə işi bir məqsədə yönəlir: layihənizin ehtiyacını düzgün anlamaq və uyğun həlli hazırlamaq.',
 'Hər sifariş əvvəlcə diqqətlə dinlənilən bir ehtiyacdır. Sonra texniki tələb, düzgün məhsul seçimi və təchizat prosesi gəlir. Metal və sənaye məhsulları, elektrik və elektronika, sənaye alətləri, laboratoriya, mexaniki və enerji avadanlıqları. Fərqli məhsul qruplarını eyni məsuliyyətlə bir araya gətiririk. Çünki sifariş siyahısındakı hər sətrin layihənin içində öz işi var.',
 'Hər şey ilk baxışda görünmür. Borunun səthindəki iz, divar qalınlığındakı dəyişiklik və ya gizli çat texniki qiymətləndirmə tələb edir. Boruların inspeksiyası və texniki yoxlanması zamanı bu detallara diqqət yetiririk. Məqsədimiz onların vəziyyətini qiymətləndirmək və istismara yararlılığı barədə əsaslandırılmış qərara dəstək verməkdir. Çünki düzgün qərar dəqiq məlumatdan başlayır.',

 'Neft-qazdan metallurgiyaya, sementdən nəqliyyata qədər fərqli sahələrin fərqli ehtiyacları var. Bu ehtiyacları birləşdirən isə etibarlı əməkdaşlıq istəyidir. Hər məhsulun, hər yoxlamanın, hər çatdırılmanın arxasında insanlar dayanır. Sual verən, yoxlayan, əlaqələndirən və işi izləyən insanlar. Caspian Industry-nin gücü həmin komandanın birgə əməyindədir.',
 'Başlanğıcda bir detal var idi. İndi onun arxasında bir komanda, bir proses və illərlə formalaşan təcrübə görünür. Növbəti layihəniz də bir ehtiyacla başlayacaq. Gəlin, həmin ehtiyac üçün uyğun həlli birlikdə müəyyən edək.'];
const SUB=[]; VO.forEach((v,i)=>{const a=T[i][1]+.9, b=i==10?226.6:T[i][2]-.5, parts=[];
  v.split(/(?<=[.?!])\s+/).forEach(s=>{ if(s.length<=76){parts.push(s);return;} let cur='';
    s.split(/(?<=[,:])\s+/).forEach(c=>{ if((cur+' '+c).trim().length<=76) cur=(cur+' '+c).trim(); else { if(cur)parts.push(cur); cur=c;
        while(cur.length>76){const k=cur.lastIndexOf(' ',76); parts.push(cur.slice(0,k)); cur=cur.slice(k+1);} } }); if(cur)parts.push(cur); });
  const m=[]; parts.forEach(p=>{ if(m.length&&(m[m.length-1]+' '+p).length<=62) m[m.length-1]+=' '+p; else m.push(p); });
  const tot=m.reduce((x,p)=>x+p.length+8,0); let t=a; m.forEach(p=>{const d=(b-a)*(p.length+8)/tot; SUB.push([t,t+d-.12,p]); t+=d;}); });
window.SUBS=SUB;

const FN={s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11}, PRE=.45, WIPE=.9;
window.seek=function(t){ t=Math.max(0,Math.min(234.999,t)); let beam=-1;
  T.forEach(([id,a,b],i)=>{const e=$(id), end=i<10?T[i+1][1]+WIPE:999, on=t>=a-PRE&&t<end; e.style.display=on?'block':'none'; if(!on)return; e.style.zIndex=i+1;
    if(id==='s6'){e.style.clipPath='none'; e.style.opacity=cl((t-(a-PRE))/PRE);} else if(i>0){const p=cl((t-(a-PRE))/WIPE); e.style.clipPath=p<1?`inset(0 0 ${(100*(1-io(p))).toFixed(3)}% 0)`:'none'; if(p>0&&p<1)beam=io(p)*1920;}
    FN[id](t-a);});
  $('beam').style.display=beam>=0?'block':'none'; $('beam').style.top=(beam-3)+'px';
  const s=SUB.find(x=>t>=x[0]&&t<x[1]); $('sub').style.display=s?'flex':'none'; if(s){$('subt').textContent=s[2]; $('sub').style.opacity=Math.min(cl((t-s[0])/.15),cl((s[1]-t)/.15));}
  $('black').style.opacity=cl(1-t/.6);
};
window.seek(0);
</script>
