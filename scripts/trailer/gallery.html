     Render: python3 scripts/trailer/render_html.py scripts/trailer/gallery.html --fps 25 --out video/output/gallery.mp4 -->
<style>
 *{box-sizing:border-box;margin:0}html,body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(90% 90% at 50% 45%,#12327d 0,#0a1d4d 45%,#060f2b 100%);font-family:Inter,'Inter Display',sans-serif;color:#fff}
 .mono{font:600 20px/1 ui-monospace,'DejaVu Sans Mono',monospace;letter-spacing:.2em}
 #pill{position:absolute;z-index:5;left:120px;top:76px;background:#2a56e8;padding:13px 20px;border-radius:12px}
 h1{position:absolute;z-index:5;text-shadow:0 4px 30px #060f2b;left:116px;top:140px;font:800 78px/1 'Inter Display';letter-spacing:-.035em}h1 i{color:#ff6a3d;font-style:normal}
 .gl{position:absolute;left:50%;width:900px;height:120px;margin-left:-450px;border-radius:50%;background:#4f86ff;filter:blur(60px);opacity:.55}
 #st{position:absolute;left:0;top:250px;width:1920px;height:760px;perspective:1150px;perspective-origin:50% 50%}
 #ring{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
 .c{position:absolute;left:-270px;top:-340px;width:540px;height:680px;border-radius:30px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
 .c .ph{position:absolute;inset:0;background-size:cover;background-position:center}
 .c .ov{position:absolute;inset:0}
 .c .k{position:absolute;left:36px;top:36px;display:flex;align-items:center;gap:14px}.c .k b{width:52px;height:52px;border-radius:14px;background:#fff;color:#0b1b3a;font:800 28px/52px Inter;text-align:center}
 .c h2{position:absolute;left:36px;right:36px;bottom:112px;font:800 50px/1.03 'Inter Display';letter-spacing:-.03em}
 .c p{position:absolute;left:36px;right:36px;bottom:40px;font:500 22px/1.3 Inter;opacity:.85}
 #dots{position:absolute;right:120px;top:96px;display:flex;gap:10px}#dots b{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}#dots u{display:block;height:100%;background:#ff6a3d;width:0}
</style>
<div class="gl" style="top:190px"></div><div class="gl" style="top:960px"></div>
<div id="pill" class="mono">2.1 · DÖRD ƏSAS İSTİQAMƏT</div><h1>Dörd əsas istiqamət<i>.</i></h1><div id="dots"></div>
<div id="st"><div id="ring"></div></div>
<script>
const S='../../video/src/', C=[
 ['A','TƏCHİZAT','Təchizat portfeli və logistika','Neft-qaz, enerji, metallurgiya və sement üçün geniş çeşid','img/WA0609','linear-gradient(200deg,rgba(42,86,232,.15),rgba(11,27,58,.92) 72%)'],
 ['B','İNSPEKSİYA','Boruların inspeksiyası və texniki yoxlama','Boru və komponentlərin texniki vəziyyətinin qiymətləndirilməsi','ref/r6a','linear-gradient(200deg,rgba(79,134,255,.2),rgba(6,15,43,.94) 72%)'],
 ['C','İCARƏ','Avadanlıq icarəsi','Layihə ehtiyacına uyğun avadanlıq və borular','ref/r5a','linear-gradient(200deg,rgba(255,106,61,.25),rgba(11,27,58,.94) 72%)'],
 ['D','KATALİZATORLAR','Katalizatorların emalı və hərracı','Toplanma, emal koordinasiyası, satış və hərrac prosedurları',null,'radial-gradient(90% 70% at 80% 10%,#ff6a3d 0,rgba(255,106,61,0) 60%),radial-gradient(90% 80% at 10% 30%,#4f86ff 0,rgba(79,134,255,0) 65%),linear-gradient(180deg,#12327d,#060f2b)']];
const R=760, STEPA=45, cl=u=>Math.max(0,Math.min(1,u)), io=u=>{u=cl(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}, eo=u=>1-Math.pow(1-cl(u),4);
const ring=document.getElementById('ring'), E=[];
for(let i=0;i<8;i++){const c=C[i%4], e=document.createElement('div'); e.className='c';
  e.innerHTML=`${c[4]?`<div class="ph" style="background-image:url(${S}${c[4]}.jpg)"></div>`:''}<div class="ov" style="background:${c[5]}"></div><div class="k"><b>${c[0]}</b><span class="mono">${c[1]}</span></div><h2>${c[2]}</h2><p>${c[3]}</p>`;
  ring.appendChild(e); E.push(e);}
C.forEach(()=>document.getElementById('dots').insertAdjacentHTML('beforeend','<b><u></u></b>'));
window.DURATION=14; const T0=1.4, ST=3.1;
window.seek=function(t){ let pos=-1.6*(1-eo(t/1.6)); for(let k=1;k<4;k++) pos+=io((t-(T0+k*ST)+.55)/1.1);
  ring.style.transform=`translateZ(${R-40+40*eo(t/2)}px) rotateY(${(-pos*STEPA).toFixed(3)}deg)`;
  E.forEach((e,i)=>{let d=((i-pos)%8+8)%8; if(d>4)d-=8; const ad=Math.abs(d); e.style.transform=`rotateY(${i*STEPA}deg) translateZ(${-R}px)`;
    e.style.visibility=ad>1.9?'hidden':'visible'; e.style.filter=`brightness(${(1-.25*Math.min(1,ad)).toFixed(3)})`; e.style.opacity=cl(t/.4);});
  [...document.querySelectorAll('#dots u')].forEach((u,i)=>u.style.width=(100*cl((t-(T0+i*ST))/ST))+'%');
  const a=eo(t/.7); document.querySelector('h1').style.opacity=a; document.getElementById('pill').style.opacity=cl(t/.5); };
window.seek(0);
</script></html>
